name: DouYin Spark Flow Schedule Run
on:
  workflow_dispatch: # 允许手动触发
    inputs:
      diagnose_only:
        description: "仅检查线上好友匹配，不输入或发送消息"
        required: false
        default: false
        type: boolean
      preview_only:
        description: "只生成预览，不登录抖音、不发送"
        required: false
        default: false
        type: boolean
      preview_count:
        description: "预览生成条数（1-10）"
        required: false
        default: "5"
        type: string
  schedule: # 定时任务
    # 抖音在一次运行里连发 49 条后作废了网页会话，所以每次运行只发一批，
    # 分散到白天三个时段续传，单次配额见 MAX_SENDS_PER_RUN。
    - cron: "0 1 * * *" # 每天 1:00 UTC（北京 9:00）
    - cron: "0 4 * * *" # 每天 4:00 UTC（北京 12:00）
    - cron: "0 7 * * *" # 每天 7:00 UTC（北京 15:00）
concurrency:
  # Native schedule and the external schedule_dev dispatcher share one lock.
  group: douyin-spark-dev
  cancel-in-progress: false
jobs:
  run-main:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    environment: user-data
    steps:
    - name: Validate delivery branch
      env:
        PREVIEW_ONLY: ${{ inputs.preview_only || 'false' }}
        DELIVERY_REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [[ "$PREVIEW_ONLY" != "true" && "$DELIVERY_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
          echo "::error::Real deliveries must run from the repository default branch to share daily delivery state."
          exit 1
        fi
    - uses: actions/checkout@v4
      with:
        ref: dev
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Test Douyin Accessibility
      run: |
        curl -I https://creator.douyin.com/
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Ensure browsers are installed
      run: playwright install chromium --with-deps --only-shell
    - name: Export Github Environment Variables
      env:
        VARS_JSON: ${{ toJson(vars) }}
      run: python utils/export_github_env.py
    - name: Restore daily delivery state
      id: delivery-date
      run: |
        mkdir -p .state
        echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      id: delivery-cache
      with:
        path: .state/delivery-state.json
        key: huohua-delivery-dev-${{ steps.delivery-date.outputs.today }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          huohua-delivery-dev-${{ steps.delivery-date.outputs.today }}-
          huohua-delivery-dev-${{ steps.delivery-date.outputs.today }}
    - name: Run DouYin Spark Flow
      env:
        PREVIEW_ONLY: ${{ inputs.preview_only || 'false' }}
        AI_PREVIEW_COUNT: ${{ inputs.preview_count || '5' }}
        DIAGNOSE_FRIEND_MATCHING: ${{ inputs.diagnose_only && '1' || vars.DIAGNOSE_FRIEND_MATCHING || '0' }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        COOKIES_33217367887: ${{ secrets.COOKIES_33217367887 }}
        BROWSER_TIMEOUT: "60000"
        CHAT_OPEN_TIMEOUT: "15000"
        CHAT_SEND_ACTION_TIMEOUT: "15000"
        CHAT_READY_TIMEOUT: "30000"
        TASK_RETRY_TIMES: "3"
        CHAT_SEARCH_RESULT_WAIT_SECONDS: "6"
        ALLOW_GLOBAL_USER_SEARCH: "1"
        HEADLESS: "1"
        REQUIRE_ALL_TARGETS: "1"
        DELIVERY_STATE_FILE: .state/delivery-state.json
        HUOHUA_COOKIE_PERSIST_FILE: .state/cookies.json
      run: python main.py
    - name: Persist refreshed Douyin session
      # Douyin rotates the login cookie during a run; without writing the
      # refreshed jar back, the next run starts from an invalidated session.
      if: ${{ always() && inputs.preview_only != true }}
      env:
        GH_TOKEN: ${{ secrets.COOKIE_WRITE_TOKEN }}
        COOKIE_SNAPSHOT: .state/cookies.json
        COOKIE_SECRET_NAME: COOKIES_33217367887
      run: |
        if [ -z "${GH_TOKEN:-}" ]; then
          echo "::notice::未配置 COOKIE_WRITE_TOKEN，跳过会话回写"
          exit 0
        fi
        if [ ! -s "$COOKIE_SNAPSHOT" ]; then
          echo "::notice::本次运行没有产生可回写的会话快照"
          exit 0
        fi
        python utils/cookie_snapshot.py "$COOKIE_SNAPSHOT"
        gh secret set "$COOKIE_SECRET_NAME" --env user-data \
          --repo "$GITHUB_REPOSITORY" < "$COOKIE_SNAPSHOT"
        echo "已回写刷新后的抖音会话到 $COOKIE_SECRET_NAME"
    - uses: actions/cache/save@v4
      if: ${{ always() && steps.delivery-date.outputs.today != '' && hashFiles('.state/delivery-state.json') != '' }}
      with:
        path: .state/delivery-state.json
        key: huohua-delivery-dev-${{ steps.delivery-date.outputs.today }}-${{ github.run_id }}-${{ github.run_attempt }}
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: run-logs
        include-hidden-files: true
        path: |
          logs/
          .state/delivery-state.json
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
